[params]
# meta description
description = "Summaries and insights from the papers I'm reading."
author = "Saymon Nicho"
dateFormat = "May 14, 2025"

# appearance
theme = "light"
# colorPalette = "catpuccin"
pagerSize = 10

# intro on main page
homeIntroTitle = "thesis research notes"
homeIntroContent = """
collection of notes and summaries from papers I reviewed as
part of a systematic literature review for my undergraduate thesis in computer science.

the thesis explores neuro-symbolic solutions to the ARC-AGI benchmark, using
lightweight language models and efficient symbolic representation techniques.

these notes aim to extract key insights and technical details relevant to
intelligence, abstraction, reasoning, generalization, and neuro-symbolic AI.

"""

